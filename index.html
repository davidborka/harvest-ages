<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>Harvest Ages – Build a Farm. Build Civilization.</title>
  <meta name="description" content="Harvest Ages – tanyasi játék 1850–1900: gazdálkodás, kvízek, kedvencek, küldetések. Böngészőben, ingyen.">
  <link rel="icon" href="icon.png">
  <meta property="og:title" content="Harvest Ages">
  <meta property="og:description" content="Build a Farm. Build Civilization. – farm game set in 1850–1900, play free in your browser.">
  <meta property="og:image" content="bg.jpg">
  <style>
    html, body { margin: 0; height: 100%; background: #2b1d10; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #2b1d10; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: #2b1d10 url("bg.jpg") center / cover no-repeat; color: #fff6e0; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
    #loader img { width: min(70vw, 520px); filter: drop-shadow(0 8px 18px rgba(0,0,0,.45)); }
    #bar { width: min(70vw, 460px); height: 18px; border-radius: 10px; background: rgba(40,25,10,.7); border: 2px solid #f2c45a; overflow: hidden; }
    #fill { height: 100%; width: 0%; background: linear-gradient(90deg, #8fd14f, #f2c45a); transition: width .2s; }
    #hint { font-size: 15px; opacity: .9; text-align: center; padding: 0 16px; }
    #warn { display: none; position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: #b3412e; color: #fff;
      padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 5; max-width: 90vw; text-align: center; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <img src="logo.png" alt="Harvest Ages">
    <div id="bar"><div id="fill"></div></div>
    <div id="hint">Betöltés… · Loading… (első alkalommal ~40 MB)</div>
  </div>
  <div id="warn"></div>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const fill = document.querySelector("#fill"), loader = document.querySelector("#loader"), warn = document.querySelector("#warn");
    function showWarn(msg) { warn.textContent = msg; warn.style.display = "block"; setTimeout(() => warn.style.display = "none", 8000); }
    const config = {
      dataUrl: "Build/93d072ee7c6dd72c24ac2bd4e6720f48.data.unityweb",
      frameworkUrl: "Build/50c754d5afe48c4191aed0fbd3eedb1b.framework.js.unityweb",
      codeUrl: "Build/aa4f26a2dee6e3f380e53f720489ca5d.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Harvest Ages Team",
      productName: "Harvest Ages",
      productVersion: "0.1.0",
      showBanner: (msg, type) => { if (type === "error") showWarn(msg); else console.log(msg); },
    };
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5); // keep phones cool
    }
    const script = document.createElement("script");
    script.src = "Build/3c126057390a2dd9b934c848327c3269.loader.js";
    script.onload = () => {
      createUnityInstance(canvas, config, (p) => { fill.style.width = (100 * p) + "%"; })
        .then(() => { loader.style.display = "none"; })
        .catch((e) => { loader.querySelector("#hint").textContent = "Hiba / Error: " + e; });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
